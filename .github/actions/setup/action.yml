name: Setup DeepTrace
description: Node 22 and the packageManager-pinned pnpm with a frozen install
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22.16.0'
    - shell: bash
      run: |
        npm install --global corepack@0.36.0
        corepack enable
        corepack prepare pnpm@11.25.0 --activate
        echo "PNPM_STORE_PATH=$(corepack pnpm store path --silent)" >> "$GITHUB_ENV"
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ env.PNPM_STORE_PATH }}
        key: pnpm-${{ runner.os }}-node22-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}
    - shell: bash
      run: corepack pnpm install --frozen-lockfile
