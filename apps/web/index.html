<!doctype html>
<html lang="vi" class="no-js">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="preload"
      href="/images/v10-hero-harvest-mobile-672.webp"
      as="image"
      type="image/webp"
      fetchpriority="high"
      media="(max-width: 980px)"
      imagesrcset="/images/v10-hero-harvest-mobile-480.webp 480w, /images/v10-hero-harvest-mobile-672.webp 672w, /images/v10-hero-harvest-mobile-960.webp 960w"
      imagesizes="calc(100vw - 40px)"
    />
    <link
      rel="preload"
      href="/images/v10-hero-harvest-960.webp"
      as="image"
      type="image/webp"
      fetchpriority="high"
      media="(min-width: 981px)"
      imagesrcset="/images/v10-hero-harvest-480.webp 480w, /images/v10-hero-harvest-960.webp 960w, /images/v10-hero-harvest-1440.webp 1440w, /images/v10-hero-harvest.webp 1920w"
      imagesizes="52vw"
    />
    <script>
      const root = document.documentElement
      root.classList.remove("no-js")

      let savedTheme = null
      try {
        savedTheme = localStorage.getItem("deeptrace-theme")
      } catch {
        savedTheme = null
      }

      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches
      const initialTheme =
        savedTheme === "light" || savedTheme === "dark"
          ? savedTheme
          : prefersDark
            ? "dark"
            : "light"
      root.classList.remove("light", "dark")
      root.classList.add(initialTheme)
    </script>
    <meta name="theme-color" content="#edeff4" />
    <meta
      name="description"
      content="DeepTrace giúp doanh nghiệp ghi nhận và chia sẻ hành trình truy xuất nguồn gốc sản phẩm từ sản xuất đến người tiêu dùng."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:url" content="https://deeptrace.deepprotech.com/" />
    <meta
      property="og:title"
      content="DeepTrace | Truy xuất nguồn gốc minh bạch"
    />
    <meta
      property="og:description"
      content="Kết nối thông tin sản phẩm và các mốc trong chuỗi cung ứng trên một hành trình dễ theo dõi."
    />
    <link rel="canonical" href="https://deeptrace.deepprotech.com/" />
    <title>DeepTrace | Truy xuất nguồn gốc minh bạch</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
